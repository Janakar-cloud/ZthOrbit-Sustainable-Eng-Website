<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CB039" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7DCC5C" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#5CB039" fill-opacity="0.35" />
      <circle cx="30" cy="20" r="2" fill="#7DCC5C" fill-opacity="0.35" />
      <circle cx="20" cy="30" r="2.5" fill="#5CB039" fill-opacity="0.3" />
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#grad)" />
  <rect width="120" height="120" fill="url(#grid)" />
</svg>
